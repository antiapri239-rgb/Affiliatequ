<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alfeto Blog CMS</title>
    <link href="config.yml" type="text/yaml" rel="cms-config-url">
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
    <script src="/admin/product-preview.js"></script>
    <script src="/admin/generate-blog-widget.js"></script>
    <script>
    // Script simpel buat nambahin shortcut link di sidebar
    const addShortcuts = setInterval(() => {
      const sidebar = document.querySelector('aside') || document.querySelector('[class*="Sidebar"]');
      if (sidebar && !document.getElementById('my-custom-shortcuts')) {
        const box = document.createElement('div');
        box.id = 'my-custom-shortcuts';
        box.style.cssText = 'padding: 12px 16px; margin-top: 15px; border-top: 1px solid #e2e8f0;';
        box.innerHTML = `
          <div style="font-size: 11px; font-weight: bold; color: #94a3b8; margin-bottom: 8px; letter-spacing: 0.5px;">PINTASAN</div>
          <a href="/admin/settings.html" target="_blank" style="display: block; padding: 5px 0; color: #2563eb; font-size: 13px; font-weight: 600; text-decoration: none;">⚙️ Pengaturan AI</a>
          <a href="/admin/pin-generator.html" target="_blank" style="display: block; padding: 5px 0; color: #059669; font-size: 13px; font-weight: 600; text-decoration: none;">📌 Pin Generator</a>
          <a href="/admin/pinterest-dashboard.html" target="_blank" style="display: block; padding: 5px 0; color: #7a5a3e; font-size: 13px; font-weight: 600; text-decoration: none;">📊 Pinterest Dashboard</a>
        `;
        sidebar.appendChild(box);
        clearInterval(addShortcuts);
      }
    }, 500);
    </script>
  </body>
</html>
