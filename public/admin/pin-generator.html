<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pin Generator — Alfeto</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f4;
      color: #292524;
      margin: 0;
      padding: 32px 20px;
      min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .subtitle { color: #78716c; margin: 0 0 28px; font-size: 14px; }
    .card {
      background: #fff;
      border: 1px solid #e7e5e4;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #57534e;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="url"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d6d3d1;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 16px;
      transition: border 0.15s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #0ea5e9;
    }
    textarea { min-height: 70px; resize: vertical; }
    button {
      background: #0ea5e9;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    button:hover { background: #0284c7; }
    button:disabled { background: #a8a29e; cursor: not-allowed; }
    button.secondary { background: #e7e5e4; color: #292524; }
    button.secondary:hover { background: #d6d3d1; }
    button.download { background: #16a34a; padding: 8px 16px; font-size: 13px; }
    button.download:hover { background: #15803d; }
    .status {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .status.show { display: block; }
    .status.success { background: #dcfce7; color: #166534; }
    .status.error { background: #fee2e2; color: #991b1b; }
    .status.info { background: #dbeafe; color: #1e40af; }
    .previews-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 20px;
    }
    @media (max-width: 1000px) {
      .previews-grid { grid-template-columns: 1fr; }
    }
    .preview-card {
      background: #fafaf9;
      border: 1px solid #e7e5e4;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 500px;
    }
    .preview-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .preview-card-title {
      font-size: 14px;
      font-weight: 700;
      color: #292524;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .preview-card-status {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 600;
    }
    .preview-card-status.pending { background: #e7e5e4; color: #78716c; }
    .preview-card-status.loading { background: #dbeafe; color: #1e40af; }
    .preview-card-status.done { background: #dcfce7; color: #166534; }
    .preview-card-status.error { background: #fee2e2; color: #991b1b; }
    .preview-card-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      padding: 8px;
      margin-bottom: 12px;
      min-height: 400px;
    }
    .preview-card-body img {
      max-width: 100%;
      max-height: 500px;
      border-radius: 6px;
    }
    .preview-card-body .placeholder {
      color: #a8a29e;
      font-size: 13px;
      text-align: center;
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(14, 165, 233, 0.2);
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .file-input-wrap { margin-bottom: 16px; }
    .file-input-wrap input[type="file"] { font-size: 13px; }
    .hint { font-size: 12px; color: #78716c; margin-top: -12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/admin/" style="display:inline-block;margin-bottom:12px;color:#7a5a3e;text-decoration:none;font-size:13px;font-weight:600;">← Kembali ke CMS</a>
    <h1>🎨 Pin Generator</h1>
    <p class="subtitle">Generate 3 style Pinterest Pin sekaligus. Ukuran 1000 × 1500 px (rasio 2:3).</p>

    <div id="status" class="status"></div>

    <div class="card">
      <label for="title">Judul Pin *</label>
<div style="margin-bottom:20px;padding:16px;background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;">
  <label style="font-weight:600;font-size:13px;">📚 Load dari Artikel</label>
  <div style="display:flex;gap:8px;margin-top:8px;">
    <select id="articleSelect" style="flex:1;padding:8px;border:1px solid #d1d5db;border-radius:6px;">
      <option value="">-- Memuat... --</option>
    </select>
    <button type="button" id="loadArticleBtn" disabled style="padding:8px 16px;background:#d1d5db;color:#9ca3af;border:none;border-radius:6px;font-weight:600;cursor:not-allowed;">Load</button>
  </div>
  <div id="loadStatus" style="font-size:12px;color:#92400e;margin-top:6px;"></div>
</div>
      <textarea id="title" placeholder="Contoh: 7 Rekomendasi Lampu Meja Minimalis Aesthetic untuk Kamar Tidur Modern"></textarea>
      <div class="hint">Maks 200 karakter. Akan dipotong otomatis di preview.</div>

      <label for="category">Kategori</label>
      <input type="text" id="category" placeholder="Contoh: Lampu &amp; Cermin" value="Artikel" />

      <label for="imageUrl">URL Gambar *</label>
      <input type="url" id="imageUrl" placeholder="https://... atau /images/blog/foto.jpg" />
      <div class="hint">Bisa URL absolute (https://...) atau path relatif (/images/blog/...).</div>

      <div id="beforeAfterFields" style="display:none; margin-top:16px; padding:12px; background:#fef3c7; border:1px solid #fbbf24; border-radius:8px;">
        <div style="font-weight:600; font-size:13px; margin-bottom:8px; color:#92400e;">📸 Khusus Before/After — butuh 2 foto:</div>
        <label for="beforeImageUrl" style="font-size:13px;">URL Foto BEFORE *</label>
        <input type="url" id="beforeImageUrl" placeholder="https://... foto sebelum" />
        <label for="afterImageUrl" style="font-size:13px; margin-top:8px; display:block;">URL Foto AFTER *</label>
        <input type="url" id="afterImageUrl" placeholder="https://... foto sesudah" />
      </div>

      <div class="file-input-wrap">
        <label for="imageFile">Atau upload gambar dari komputer:</label>
        <input type="file" id="imageFile" accept="image/*" />
      </div>

      <div>
        <div id="styleSelector" style="margin: 16px 0; padding: 16px; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <strong style="font-size: 14px; color: #374151;">Pilih Style:</strong>
            <div>
              <button type="button" id="selectAllBtn" style="font-size: 12px; padding: 4px 10px; margin-right: 6px; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer;">Pilih Semua</button>
              <button type="button" id="clearAllBtn" style="font-size: 12px; padding: 4px 10px; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer;">Kosongkan</button>
            </div>
          </div>
          <div id="styleCheckboxes" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
        </div>
        <button id="generateBtn">✨ Generate Style Terpilih</button>
        <button id="clearBtn" class="secondary">Reset</button>
        <button id="uploadExportBtn" style="background: #059669; color: white; margin-left: 8px; display: none;">☁️ Upload & Export CSV</button>
      </div>
    </div>

    <div class="previews-grid" id="previewsGrid">
      <!-- Preview cards di-inject oleh JS -->
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const STYLES = [
      { key: 'warm', label: 'Warm' },
      { key: 'poster', label: 'Poster' },
      { key: 'typography', label: 'Typography' },
      { key: 'bold-type', label: 'Bold Type' },
      { key: 'listicle', label: 'Listicle' },
      { key: 'before-after', label: 'Before/After', needsTwo: true },
    ];

    let currentBlobs = {};
    // State baru: simpan blob asli + metadata buat upload Blob & CSV
    let pinMetadata = {};  // { styleKey: { blob, title, category, style, blobUrl } }
    let uploadedPins = {}; // { styleKey: { url, pathname, keywords } }
    // Default 3 style pertama ke-check
    let selectedStyles = new Set(['warm']);

    function renderStyleCheckboxes() {
      const container = document.getElementById('styleCheckboxes');
      if (!container) return;
      container.innerHTML = '';
      STYLES.forEach(style => {
        const isChecked = selectedStyles.has(style.key);
        const label = document.createElement('label');
        label.style.cssText = 'display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-size: 13px; user-select: none;';
        label.innerHTML = '<input type="checkbox" data-style="' + style.key + '" ' + (isChecked ? 'checked' : '') + ' style="cursor: pointer;">' + style.label;
        const checkbox = label.querySelector('input');
        checkbox.addEventListener('change', (e) => {
          if (e.target.checked) {
            selectedStyles.add(style.key);
          } else {
            selectedStyles.delete(style.key);
          }
          updateGenerateBtnLabel();
          toggleBeforeAfterFields();
        });
        container.appendChild(label);
      });
      updateGenerateBtnLabel();
      toggleBeforeAfterFields();
    }

    function toggleBeforeAfterFields() {
      const fields = document.getElementById('beforeAfterFields');
      if (!fields) return;
      const hasBeforeAfter = selectedStyles.has('before-after');
      fields.style.display = hasBeforeAfter ? 'block' : 'none';
    }

    function updateGenerateBtnLabel() {
      const btn = document.getElementById('generateBtn');
      if (!btn) return;
      const count = selectedStyles.size;
      btn.textContent = count > 0
        ? '✨ Generate ' + count + ' Style'
        : '✨ Pilih minimal 1 style';
      btn.disabled = count === 0;
    }

    function showStatus(msg, type = 'info') {
      const el = $('status');
      el.innerHTML = msg;
      el.className = 'status show ' + type;
    }

    function hideStatus() {
      $('status').className = 'status';
    }

    function renderPreviewCards() {
      const grid = $('previewsGrid');
      grid.innerHTML = '';
      STYLES.forEach(style => {
        const card = document.createElement('div');
        card.className = 'preview-card';
        card.innerHTML = `
          <div class="preview-card-header">
            <div class="preview-card-title">${style.label}</div>
            <div class="preview-card-status pending" id="status-${style.key}">Menunggu</div>
          </div>
          <div class="preview-card-body" id="body-${style.key}">
            <div class="placeholder">Belum di-render</div>
          </div>
          <div id="actions-${style.key}" style="display: none;">
            <button class="download" data-style="${style.key}">📥 Download PNG</button>
          </div>
        `;
        grid.appendChild(card);
      });

      // Attach download handlers
      document.querySelectorAll('.download').forEach(btn => {
        btn.addEventListener('click', () => {
          const style = btn.getAttribute('data-style');
          if (!currentBlobs[style]) return;
          const title = $('title').value.trim().slice(0, 40).replace(/[^a-zA-Z0-9]+/g, '-').toLowerCase() || 'pin';
          const a = document.createElement('a');
          a.href = currentBlobs[style];
          a.download = `alfeto-pin-${style}-${title}.png`;
          a.click();
        });
      });
    }

    function updateCardStatus(style, status, text) {
      const el = $(`status-${style}`);
      if (!el) return;
      el.className = 'preview-card-status ' + status;
      el.textContent = text;
    }

    function updateCardBody(style, html) {
      const el = $(`body-${style}`);
      if (!el) return;
      el.innerHTML = html;
    }

    $('imageFile').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        $('imageUrl').value = reader.result;
        showStatus('Gambar di-load dari file. Siap di-render.', 'info');
      };
      reader.readAsDataURL(file);
    });

    $('clearBtn').addEventListener('click', () => {
      $('title').value = '';
      $('category').value = 'Artikel';
      $('imageUrl').value = '';
      $('imageFile').value = '';
      hideStatus();
      // Revoke blobs
      Object.values(currentBlobs).forEach(url => URL.revokeObjectURL(url));
      currentBlobs = {};
      renderPreviewCards();
    });

    async function renderOneStyle({ title, imageUrl, category, styleKey, index, total }) {
      updateCardStatus(styleKey, 'loading', 'Rendering...');
      updateCardBody(styleKey, '<div class="spinner"></div>');

      try {
        const res = await fetch('/api/generate-pin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            imageUrl,
            beforeImageUrl: document.getElementById('beforeImageUrl')?.value || '',
            afterImageUrl: document.getElementById('afterImageUrl')?.value || '',
            category,
            style: styleKey,
          }),
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }

        const blob = await res.blob();
        if (currentBlobs[styleKey]) URL.revokeObjectURL(currentBlobs[styleKey]);
        currentBlobs[styleKey] = URL.createObjectURL(blob);

        // Simpan blob asli + metadata buat upload
        pinMetadata[styleKey] = {
          blob,
          title,
          category,
          style: styleKey,
          styleLabel: (STYLES.find(s => s.key === styleKey) || {}).label || styleKey,
        };

        const img = document.createElement('img');
        img.src = currentBlobs[styleKey];
        img.alt = `${styleKey} preview`;
        updateCardBody(styleKey, '');
        $(`body-${styleKey}`).appendChild(img);

        updateCardStatus(styleKey, 'done', 'Selesai');
        $(`actions-${styleKey}`).style.display = 'block';

        const sizeKB = Math.round(blob.size / 1024);
        console.log(`[${styleKey}] Berhasil: ${sizeKB} KB`);
        return { ok: true, styleKey };
      } catch (e) {
        console.error(`[${styleKey}] Error:`, e);
        updateCardStatus(styleKey, 'error', 'Gagal');
        updateCardBody(styleKey, `<div class="placeholder" style="color: #991b1b;">❌ ${e.message}</div>`);
        return { ok: false, styleKey, error: e.message };
      }
    }

    $('generateBtn').addEventListener('click', async () => {
      if (selectedStyles.size === 0) {
        showStatus('⚠️ Pilih minimal 1 style dulu.', 'error');
        return;
      }

      const title = $('title').value.trim();
      const imageUrl = $('imageUrl').value.trim();
      const category = $('category').value.trim() || 'Artikel';

      if (!title) { showStatus('Judul wajib diisi', 'error'); return; }
      const hasBeforeAfter = selectedStyles.has('before-after');
        if (!imageUrl && !hasBeforeAfter) { showStatus('URL gambar wajib diisi', 'error'); return; }
        if (hasBeforeAfter) {
          const bUrl = document.getElementById('beforeImageUrl')?.value?.trim();
          const aUrl = document.getElementById('afterImageUrl')?.value?.trim();
          if (!bUrl || !aUrl) { showStatus('Style Before/After butuh 2 foto (before + after)', 'error'); return; }
        }

      $('generateBtn').disabled = true;
      $('generateBtn').textContent = 'Sedang render...';

      // Revoke blob lama
      Object.values(currentBlobs).forEach(url => URL.revokeObjectURL(url));
      currentBlobs = {};
      renderPreviewCards();

      const results = [];
      // Ambil style yang dipilih
      const stylesToRender = STYLES.filter(s => selectedStyles.has(s.key));

      for (let i = 0; i < stylesToRender.length; i++) {
        const style = stylesToRender[i];
        showStatus(`Sedang render <strong>${style.label}</strong> (${i + 1}/${stylesToRender.length})...`, 'info');
        const result = await renderOneStyle({
          title,
          imageUrl,
          category,
          styleKey: style.key,
          index: i + 1,
          total: stylesToRender.length,
        });
        results.push(result);
      }

      const total = stylesToRender.length;
      const successCount = results.filter(r => r.ok).length;
      // Show tombol upload kalau ada pin
      if (Object.keys(pinMetadata).length > 0) {
        $('uploadExportBtn').style.display = 'inline-block';
      }

      if (successCount === total) {
        showStatus(`✅ ${total} style berhasil di-render!`, 'success');
      } else if (successCount === 0) {
        showStatus(`❌ Semua render gagal. Cek console browser.`, 'error');
      } else {
        showStatus(`⚠️ ${successCount}/${total} style berhasil. Ada yang gagal.`, 'error');
      }

      $('generateBtn').disabled = false;
      updateGenerateBtnLabel();
    });

    // ============ UPLOAD & EXPORT CSV ============
    async function uploadAllAndExport() {
      const btn = $('uploadExportBtn');
      const keys = Object.keys(pinMetadata);

      if (keys.length === 0) {
        showStatus('⚠️ Belum ada pin. Generate dulu.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = '☁️ Uploading...';
      uploadedPins = {};

      let successCount = 0;

      for (let i = 0; i < keys.length; i++) {
        const styleKey = keys[i];
        const meta = pinMetadata[styleKey];

        showStatus(`Uploading <strong>${meta.styleLabel}</strong> (${i + 1}/${keys.length})...`, 'info');

        try {
          // Convert blob ke base64
          const reader = new FileReader();
          const base64Promise = new Promise((resolve) => {
            reader.onloadend = () => resolve(reader.result.split(',')[1]);
            reader.readAsDataURL(meta.blob);
          });
          const base64 = await base64Promise;

          // Upload via endpoint
          const res = await fetch('/api/generate-pin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: meta.title,
              category: meta.category,
              imageUrl: 'data:image/png;base64,' + base64,
              style: styleKey,
              upload: true,
              pngBase64: base64,
            }),
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error || `HTTP ${res.status}`);
          }

          const data = await res.json();
          uploadedPins[styleKey] = {
            url: data.url,
            pathname: data.pathname,
            style: styleKey,
            title: meta.title,
            category: meta.category,
            keywords: data.keywords || [],
          };
          successCount++;
        } catch (e) {
          console.error(`[upload ${styleKey}]`, e);
        }
      }

      if (successCount === 0) {
        showStatus('❌ Semua upload gagal. Cek Console.', 'error');
        btn.disabled = false;
        btn.textContent = '☁️ Upload & Export CSV';
        return;
      }

      // ============ EXPORT CSV ============
      showStatus(`✅ ${successCount} pin ke-upload. Generate CSV...`, 'info');
      btn.textContent = '📊 Downloading CSV...';

      const pins = Object.values(uploadedPins).map(p => ({
        title: p.title,
        imageUrl: p.url,
        category: p.category,
        style: p.style,
        link: 'https://alfeto.vercel.app/blog/' + (p.title || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''),
        keywords: p.keywords,
      }));

      try {
        const res = await fetch('/api/export-csv', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pins,
            schedule: true,
            pinsPerDay: 3,
          }),
        });

        if (!res.ok) throw new Error('Export CSV gagal');

        const csvBlob = await res.blob();
        const url = URL.createObjectURL(csvBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'alfeto-pins-' + Date.now() + '.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        showStatus(`🎉 Berhasil! ${successCount} pin ke-upload + CSV ke-download.`, 'success');
      } catch (e) {
        showStatus(`⚠️ Upload OK, tapi CSV gagal: ${e.message}`, 'error');
      }

      btn.disabled = false;
      btn.textContent = '☁️ Upload & Export CSV';
    }

    // Event: Upload & Export
    document.getElementById('uploadExportBtn')?.addEventListener('click', uploadAllAndExport);

    // Init
    renderPreviewCards();
    renderStyleCheckboxes();
    prefillFromQuery();

async function loadArticleList(){
  const sel=document.getElementById('articleSelect');
  try{
    const r=await fetch('/api/pinterest-articles');
    const d=await r.json();
    sel.innerHTML='<option value="">-- Pilih Artikel --</option>'+d.articles.map((a,i)=>`<option value="${i}">${a.title}</option>`).join('');
    sel._articles=d.articles;
    document.getElementById('loadStatus').textContent='OK '+d.articles.length+' artikel siap.';
    updateLoadBtnState();
  }catch(e){document.getElementById('loadStatus').textContent='ERR '+e.message;}
}
function updateLoadBtnState(){
  const sel=document.getElementById('articleSelect');
  const btn=document.getElementById('loadArticleBtn');
  if(!sel||!btn)return;
  const hasValue=sel.value!=='';
  btn.disabled=!hasValue;
  if(hasValue){
    btn.style.background='#f59e0b';
    btn.style.color='#fff';
    btn.style.cursor='pointer';
  } else {
    btn.style.background='#d1d5db';
    btn.style.color='#9ca3af';
    btn.style.cursor='not-allowed';
  }
}
document.getElementById('articleSelect')?.addEventListener('change',updateLoadBtnState);

document.getElementById('loadArticleBtn')?.addEventListener('click',()=>{
  const sel=document.getElementById('articleSelect');
  const a=sel._articles?.[sel.value];
  if(!a)return;
  document.getElementById('title').value=a.title;
  document.getElementById('category').value=a.category;
  document.getElementById('imageUrl').value=a.heroImage;
  document.getElementById('loadStatus').textContent='Form terisi.';
});
loadArticleList();


    // Event: Pilih Semua
    document.getElementById('selectAllBtn')?.addEventListener('click', () => {
      STYLES.forEach(s => selectedStyles.add(s.key));
      renderStyleCheckboxes();
    });

    // Event: Kosongkan
    document.getElementById('clearAllBtn')?.addEventListener('click', () => {
      selectedStyles.clear();
      renderStyleCheckboxes();
    });

    // Baca query param & auto-isi form
    // Contoh: /admin/pin-generator.html?title=Rak+Ambalan&category=Dekorasi&image=/images/blog/foto.jpg&cta=Simak+yuk
    function prefillFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const title = params.get('title');
      const category = params.get('category');
      const image = params.get('image');
      const cta = params.get('cta');

      let filled = 0;

      if (title) {
        const el = $('title') || document.querySelector('[name="title"]') || document.querySelector('textarea');
        if (el) { el.value = title; filled++; }
      }

      if (category) {
        const el = $('category') || document.querySelector('[name="category"]') || document.querySelector('input[type="text"]:not([id*="title"])');
        if (el) { el.value = category; filled++; }
      }

      if (image) {
        const el = $('imageUrl') || document.querySelector('[name="imageUrl"]') || document.querySelector('input[type="url"], input[placeholder*="URL"], input[placeholder*="https"]');
        if (el) { el.value = image; filled++; }
      }

      if (cta) {
        const el = $('cta') || document.querySelector('[name="cta"]') || document.querySelector('input[placeholder*="CTA"], textarea[placeholder*="CTA"]');
        if (el) { el.value = cta; filled++; }
      }

      if (filled > 0) {
        console.log('[pin-generator] Prefill dari query param:', { title, category, image, cta, filled });
        showStatus('✅ Form auto-isi dari artikel. Cek & klik Generate.', 'success');
      }
    }
  </script>
</body>
</html>
