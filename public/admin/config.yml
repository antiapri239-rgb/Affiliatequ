backend:
  name: github
  repo: antiapri239-rgb/Affiliatequ
  branch: main
  base_url: https://rianti-cms-proxy.rianti.workers.dev
  auth_endpoint: /auth

publish_mode: simple

media_folder: public/images/blog
public_folder: /images/blog

collections:
  - name: categories
    label: Kategori
    folder: src/data/category-options
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: title
    slug: "{{id}}"
    fields:
      - label: ID Kategori
        name: id
        widget: string
        pattern:
          - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - 'Gunakan huruf kecil, angka, dan tanda hubung. Contoh: skincare-wajah'
      - label: Nama Kategori
        name: title
        widget: string
  - name: products
    label: Produk
    folder: src/data/products
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: "{{slug}}"
    view_filters:
      - label: Cleanser
        field: category
        pattern: cleanser
      - label: Moisturizer
        field: category
        pattern: moisturizer
      - label: Sunscreen
        field: category
        pattern: sunscreen
      - label: Serum
        field: category
        pattern: serum
      - label: Masker
        field: category
        pattern: masker
      - label: Toner
        field: category
        pattern: toner
      - label: Cushion
        field: category
        pattern: cushion
    fields:
      - label: ID Produk
        name: id
        widget: string
      - label: Nama Produk
        name: title
        widget: string
      - label: Deskripsi Produk
        name: description
        widget: text
        required: false
      - label: Kategori
        name: category
        widget: relation
        collection: categories
        search_fields:
          - title
          - id
        value_field: id
        display_fields:
          - title
      - label: Gambar Produk
        name: image
        widget: image
        media_folder: /public/images/products
        public_folder: /images/products
        choose_url: true
      - label: Link Shopee
        name: shopeeUrl
        widget: string
      - label: Label Promo
        name: badge
        widget: string
        required: false
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - label: Judul
        name: title
        widget: string
      - label: Deskripsi
        name: description
        widget: ai-description
      - label: Tanggal Terbit
        name: pubDate
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: Gambar Utama
        name: heroImage
        widget: image
      - label: Draft
        name: draft
        widget: boolean
        default: true
      - label: Isi Artikel
        name: body
        widget: ai-markdown
      - label: Pengaturan Lanjutan
        name: advanced
        widget: object
        collapsed: true
        fields:
          - label: Kategori
            name: category
            widget: relation
            collection: categories
            search_fields:
              - title
              - id
            value_field: id
            display_fields:
              - title
          - label: Jadwal Terbit
            name: publishAt
            widget: datetime
            required: false
            date_format: "YYYY-MM-DD"
            time_format: "HH:mm"
            format: "YYYY-MM-DDTHH:mm:ssZ"
            picker_utc: false
            hint: Waktu mengikuti zona waktu perangkat. Atur perangkat ke WIB (UTC+07:00); kosongkan agar artikel terbit saat deploy.
          - label: Judul SEO
            name: seoTitle
            widget: string
            required: false
            hint: Jika kosong, judul artikel dipakai sebagai judul SEO.
          - label: Deskripsi SEO
            name: seoDescription
            widget: text
            required: false
            hint: Jika kosong, deskripsi artikel dipakai sebagai deskripsi SEO.
          - label: Tags
            name: tags
            widget: ai-tags
            required: false
            field:
              label: Tag
              name: tag
              widget: string
          - label: Galeri Gambar
            name: galleryImages
            widget: list
            required: false
            fields:
              - label: Gambar
                name: image
                widget: image
              - label: Alt Text
                name: alt
                widget: string
                hint: Deskripsikan isi gambar untuk aksesibilitas.
              - label: Caption
                name: caption
                widget: text
                required: false
          - label: ID Produk
            name: productIds
            widget: relation
            collection: products
            search_fields:
              - title
              - id
              - category
            value_field: id
            display_fields:
              - "{{title}} ({{category}})"
            multiple: true
            required: false
          - label: CTA Pin (opsional)
            name: pinCta
            widget: string
            required: false
            hint: "Teks CTA untuk Pinterest Pin. Kalau kosong, AI generate otomatis dari judul. Contoh: 'Simak cara pilih rak estetik, lanjut baca yuk bestie'" 

  - name: pintasan
    label: Pintasan
    files:
      - name: pengaturan-ai
        label: Pengaturan AI
        file: public/admin/settings.html
        fields:
          - { label: Catatan, name: note, widget: string, required: false }
      - name: pin-generator
        label: Pin Generator
        file: public/admin/pin-generator.html
        fields:
          - { label: Catatan, name: note, widget: string, required: false }
      - name: pinterest-dashboard
        label: Pinterest Dashboard
        file: public/admin/pinterest-dashboard.html
        fields:
          - { label: Catatan, name: note, widget: string, required: false }
